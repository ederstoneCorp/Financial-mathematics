services:
  - type: web
    name: sma2207-financial-mathematics
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sma2207-database
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: sma2207-database
    plan: free
